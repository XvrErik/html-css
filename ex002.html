<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> utilisando o hover</title>
    <style>

        div > p{
            display: none;
        }

        div:hover{
            color: red;
        }

        div:hover > p {
            display: block;
            background-color: red;
            color: white;
        }
    </style>
</head>
<body>
    <h1>usando hover</h1>
    <p>passe o mause no texto abaixo</p>
    <div>passe o mause aqui
    <P>TEXTO ESCONDIDO...</P>
    </div>
</body>
</html>
