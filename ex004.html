<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
    <style>
        /*
        # = id
        . = class
        : = pseudo-classe
        :: = pseudo-elemento
        > = children
        */
        a{
            color: green;
            text-decoration: none;
        }

        a:hover{
            text-decoration: underline;
        }

        a:visited{
            color: blue;
        }
    </style>
</head>
<body>
    <h1> personalisando links</h1>
    <ul>
        <li><a href="https://github.com/XvrErik" target="_blank"> github</a></li>
        <li><a href="https://www.youtube.com/" target="_blank">youtube</a></li>
    </ul>
</body>
</html>
