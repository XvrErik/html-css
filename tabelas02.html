<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>
    <style>
        table{
            border-collapse: collapse;
            width: 250px;
            height: 200px;
            margin: auto;
            
        }
        body{
            background-color: #102758;
            color: white;
        }
        td{
            background-color: white;
            border: 1px solid black;
            color: black;
        }
        td:hover{
            text-decoration: underline;
            background-color: darkgray;
        }
        td:active{
            background-color: gray;
        }
    </style>
</head>
<body>
    <h1>aprendendo tabelas</h1>
    <table>
        <tr>
            <td>a</td>
            <td colspan="2">b</td>
            
        </tr>
        <tr>
            <td>d</td>
            <td>e</td>
            <td rowspan="2">f</td>
        </tr>
        <tr>

            <td>h</td>
            <td>i</td>
        </tr>
    </table>
</body>
</html>
