<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>desafio 2 de tabelas</title>
    <style>
        table{
            width: 300px;
            height: 300px;
            border-collapse: collapse;
            text-align: center;
        }
        thead > tr > th{
            background-color: gray;
            border: 1px solid black;
        }
        tbody > tr > th{
            border: 1px solid black;
        }
        tbody > tr > td{
            border: 1px solid black;
        }
        th#mediasExatas{
            background-color: gray;
        }
        th#mediasHumanas{
            background-color: gray;
        }
        td:hover{
            text-decoration: underline;
        }
        th:hover{
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2" scope="row">area</th>
                <th rowspan="2" scope="row">disciplinas</th>
                <th colspan="2" scope="rowgroup">notas</th>
                <th rowspan="2" scope="row">media</th>
            </tr>
            <tr>
                <th scope="row">nota1</th>
                <th scope="row">nota2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4">exatas</th>
                <th scope="col">matenatica</th>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th scope="col">fisica</th>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th scope="col">quimica</th>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th scope="col">biologia</th>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th colspan="4" scope="col" id="mediasExatas">medias exatas</th>
                <td>0.0</td>
            </tr>
            <tr>
                <th rowspan="2" scope="colgroup">humanas</th>
                <th scope="col">historia</th>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th scope="col">geografia</th>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th colspan="4" scope="col" id="mediasHumanas">medias humanas</th>
                <td>0.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
